name: Release

# Push a tag like v2.1.0 to build the Windows installer and the Linux AppImage and publish them as a GitHub
# release. Installed apps find new releases there (Velopack update feed).
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Install packaging tools
      run: |
        sudo apt-get update && sudo apt-get install -y squashfs-tools
        dotnet tool install -g vpk --version 1.2.161
    - name: Test
      run: dotnet test tests/LighthouseManager.Tests --configuration Release
    - name: Version from tag
      run: |
        echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
        # v2.1.0-rc.1 etc. become pre-releases; installed apps only update to stable releases
        if [[ "$GITHUB_REF_NAME" == *-* ]]; then echo "PRE=--pre" >> "$GITHUB_ENV"; fi
    - name: Build packages
      run: |
        for channel in win linux; do
          # Previous release for delta updates (missing on the first release, that's fine)
          vpk download github --repoUrl "$REPO_URL" --token "${{ secrets.GITHUB_TOKEN }}" \
            --channel "$channel" --outputDir "releases/$channel" || true
        done
        build/pack.sh win-x64 "$VERSION"
        build/pack.sh linux-x64 "$VERSION"
    - name: Publish GitHub release
      run: |
        vpk upload github --repoUrl "$REPO_URL" --token "${{ secrets.GITHUB_TOKEN }}" --outputDir releases/win \
          --channel win --publish $PRE --releaseName "LighthouseManager $VERSION" --tag "$GITHUB_REF_NAME"
        vpk upload github --repoUrl "$REPO_URL" --token "${{ secrets.GITHUB_TOKEN }}" --outputDir releases/linux \
          --channel linux --publish $PRE --merge --releaseName "LighthouseManager $VERSION" --tag "$GITHUB_REF_NAME"
